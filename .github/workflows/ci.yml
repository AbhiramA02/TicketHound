name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  api:
    name: API lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Mypy (core modules)
        run: mypy app/schemas app/providers app/core/config.py app/core/errors.py || true
      - name: Pytest
        run: pytest -q
      - name: Alembic config loads
        run: python -c "from alembic.config import Config; Config('alembic.ini'); print('alembic ok')"

  web:
    name: Web lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
